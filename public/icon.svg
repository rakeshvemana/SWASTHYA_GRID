<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" stroke="url(#gridGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.3" />
  
  <!-- Healthcare Cross with Network Nodes -->
  <rect x="220" y="120" width="72" height="272" rx="20" fill="url(#gridGrad)" />
  <rect x="120" y="220" width="272" height="72" rx="20" fill="url(#gridGrad)" />

  <!-- Node Dots & Pulses -->
  <circle cx="256" cy="120" r="18" fill="#38bdf8" />
  <circle cx="256" cy="392" r="18" fill="#34d399" />
  <circle cx="120" cy="256" r="18" fill="#38bdf8" />
  <circle cx="392" cy="256" r="18" fill="#34d399" />
  
  <!-- Center Core AI Pulse -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
  <circle cx="256" cy="256" r="14" fill="#0284c7" />
</svg>
